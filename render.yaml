# Render 배포 설정 (Blueprint) — 무료 플랜
# 대시보드에서 "New > Blueprint"로 이 저장소를 연결하면 이 파일대로 구성됩니다.
#
# ── 무료 플랜의 제약 ─────────────────────────────────────────────
# 1) 디스크가 재배포·재시작 때마다 초기화됩니다. 그래서 업로드 영상과 프로필 사진은
#    Firebase Storage에 저장합니다 (FIREBASE_SERVICE_ACCOUNT 필요).
#    강좌·수강·진도 데이터는 원래부터 Firestore에 있으므로 영향이 없습니다.
# 2) 약 15분간 요청이 없으면 서비스가 잠들고, 다음 요청에서 깨어나는 데 30~60초가 걸립니다.
#    이때 서버 메모리에만 있는 로그인 세션은 사라지므로 다시 로그인해야 합니다.

services:
  - type: web
    name: tdsntlms
    runtime: node
    plan: free
    region: singapore # 한국에서 가장 가까운 리전
    # NODE_ENV=production 이면 npm ci 가 devDependencies(esbuild 등)를 빼므로 --include=dev 필요
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # 아래 값들은 커밋하지 않습니다 — Render 대시보드 > Environment 에서 직접 입력하세요.
      # Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > "새 비공개 키 생성"으로 받은 JSON 전체 (또는 base64)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # 기본 관리자 계정의 초기 비밀번호
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # 배포 주소 (예: https://tdsntlms.onrender.com) — OAuth 콜백에 사용
      - key: APP_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Discord 운영 알림(수강·수료·문의·보안 경고). 채널 편집 > 연동 > 웹후크에서 복사한 URL.
      # 이 URL이 있으면 누구나 채널에 글을 쓸 수 있으므로 저장소나 화면에 두지 않습니다.
      - key: DISCORD_WEBHOOK_URL
        sync: false

      # 소셜 로그인 (사용하는 것만 입력). VITE_* 값은 빌드 시점에 화면 코드에 들어갑니다.
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: VITE_KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: VITE_NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

    # PORT 는 Render 가 자동 주입하며 server.ts 가 process.env.PORT 로 읽습니다.
